  kmer_filter:         {threads: 1,  mem_mb: 8000,  runtime: 60,  lsf_queue: ""}
  strain_detect:       {threads: 8,  mem_mb: 16000, runtime: 120, lsf_queue: ""}
  coverage_depth:      {threads: 1,  mem_mb: 8000,  runtime: 60,  lsf_queue: ""}
  hit_call:            {threads: 1,  mem_mb: 4000,  runtime: 30,  lsf_queue: ""}